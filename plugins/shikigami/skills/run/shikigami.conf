# Shikigami defaults. Do not edit this file: plugin updates replace it.
# Run `worker.sh config` to create your own settings file (~/.config/shikigami/shikigami.conf),
# then uncomment and change what you need there. An environment variable of the same name beats both.

# Worker model, without the #variant (worker.sh adds the effort).
# Free tier: opencode/deepseek-v4.1-flash-free. On OpenCode Go, run `opencode models` and use the Go ID.
WORKER_MODEL="${WORKER_MODEL:-opencode/deepseek-v4.1-flash-free}"
# Worker effort (the model's #variant). Retries pass --effort max.
WORKER_EFFORT="${WORKER_EFFORT:-high}"

# Second-pass reviewer. GLM-5.3 Flash gives far fewer wrong answers than DeepSeek when it is unsure,
# which suits checking proofs and extra edits. Z.ai recommends max effort for it.
REVIEWER_MODEL="${REVIEWER_MODEL:-opencode/glm-5.3-flash-free}"
REVIEWER_EFFORT="${REVIEWER_EFFORT:-max}"
# Used when the reviewer fails or hits its usage limit. Empty means no fallback.
REVIEWER_FALLBACK_MODEL="${REVIEWER_FALLBACK_MODEL-$WORKER_MODEL}"

# Black-box tester: writes tests from the brief and contract alone (it never sees the worker's code),
# running alongside the worker; failures go back to the worker. "on" or "off". It uses extra quota.
TEST_WRITER="${TEST_WRITER:-off}"
TESTER_MODEL="${TESTER_MODEL:-$REVIEWER_MODEL}"
TESTER_EFFORT="${TESTER_EFFORT:-high}"

# Extra edits are judged by what they are, not by how many files they touch: the smallest change that fixes a proven defect in existing code that blocks the brief. These files are off-limits for extra edits (the file-boundary gate fails) unless the brief lists them in allowed_files, because a change there affects everyone and is easy to miss. Space-separated globs; "**/" matches any folder, including the repo root; matching ignores case. Set it to "" to turn the check off.
EXTRA_EDIT_PROTECTED="${EXTRA_EDIT_PROTECTED-**/package.json **/package-lock.json **/npm-shrinkwrap.json **/pnpm-lock.yaml **/pnpm-workspace.yaml **/yarn.lock **/bun.lock **/bun.lockb **/deno.json **/deno.lock **/requirements*.txt **/pyproject.toml **/poetry.lock **/uv.lock **/Pipfile **/Pipfile.lock **/setup.py **/setup.cfg **/go.mod **/go.sum **/Cargo.toml **/Cargo.lock **/Gemfile **/Gemfile.lock **/composer.json **/composer.lock **/pom.xml **/build.gradle **/build.gradle.kts **/settings.gradle **/settings.gradle.kts **/*.csproj **/*.sln **/Directory.Packages.props **/Directory.Build.props **/.github/** **/.gitlab-ci.yml **/.circleci/** **/azure-pipelines.yml **/Jenkinsfile **/Dockerfile* **/*.Dockerfile **/docker-compose*.yml **/docker-compose*.yaml **/compose*.yml **/compose*.yaml **/Makefile **/tsconfig*.json **/vite.config.* **/vitest.config.* **/jest.config.* **/webpack.config.* **/rollup.config.* **/next.config.* **/svelte.config.* **/astro.config.* **/nuxt.config.* **/eslint.config.* **/.eslintrc* **/turbo.json **/nx.json **/.npmrc **/.yarnrc **/.yarnrc.yml **/.pnpmfile.cjs **/.husky/** **/lefthook.yml **/.lefthook.yml **/.pre-commit-config.yaml **/.envrc **/.vscode/** **/.idea/** **/.devcontainer/** **/migrations/** **/Migrations/** **/db/migrate/** **/prisma/migrations/**}"

# How many workers may run at once. Extra runs wait for a free slot. This is not a quota control:
# a usage limit pauses the model instead (see `worker.sh resume`).
MAX_PARALLEL="${MAX_PARALLEL:-8}"

# OpenCode CLI (version 2 or newer). If not on PATH, worker.sh also looks in the usual install folders.
OPENCODE_BIN="${OPENCODE_BIN:-opencode}"
# --standalone gives each run a private OpenCode server, independent of the background service.
OPENCODE_RUN_FLAGS="${OPENCODE_RUN_FLAGS:---standalone}"

# Tools for the agents (written to .shikigami/opencode.jsonc for each run; your global OpenCode config is not changed):
# - Formatters, which run only when the repo has Prettier or Biome set up.
# - Context7 library docs for the worker and the reviewer, through web fetches to https://context7.com/api/v2/
#   only (allowed in opencode-agents/*.md). Anonymous use has a lower rate limit.

# Seconds before a hung OpenCode run is stopped (catches hangs; not a work budget).
WORKER_TIMEOUT="${WORKER_TIMEOUT:-7200}"
# Seconds allowed for each acceptance command and for the black-box test run.
ACCEPT_TIMEOUT="${ACCEPT_TIMEOUT:-900}"
# Lines of failure output shown to Opus.
FAIL_TAIL_LINES="${FAIL_TAIL_LINES:-40}"
